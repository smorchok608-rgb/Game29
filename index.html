.cell{margin:1.4%;background:linear-gradient(145deg,rgba(255,240,210,.09),rgba(0,0,0,.35));box-shadow:inset 0 0 6px #000,inset 1px 1px 0 rgba(255,240,210,.1);display:flex;align-items:center;justify-content:center;border-radius:3px}
.cell.x{background:#050403;box-shadow:inset 0 0 10px #000;background-image:linear-gradient(35deg,transparent 46%,#2a2118 47% 50%,transparent 51%),linear-gradient(-50deg,transparent 48%,#2a2118 49% 51%,transparent 52%)}
.cell.spin{animation:ts .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes ts{from{transform:rotate(-90deg) scale(.8);filter:brightness(2.4)}}
.rune{width:78%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',serif;font-size:calc(var(--b)/9*.5);color:var(--c);background:radial-gradient(circle,#0b0806 55%,#1c1510);border:2px solid var(--c);box-shadow:0 0 12px var(--c),inset 0 0 10px #000;text-shadow:0 0 8px var(--c);position:relative;z-index:3;animation:br 2.4s ease-in-out infinite alternate}
@keyframes br{to{box-shadow:0 0 24px var(--c),inset 0 0 12px #000}}
.pt{width:86%;aspect-ratio:1;border-radius:50%;position:relative;z-index:3;display:flex;align-items:center;justify-content:center}
.pt::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c),transparent,var(--c),transparent,var(--c));animation:sp 2.2s linear infinite;filter:blur(1px)}
.pt::after{content:"";position:absolute;inset:20%;border-radius:50%;background:radial-gradient(#000,#150f26)}
.pt i{position:relative;z-index:1;font-style:normal;color:var(--c);font-size:calc(var(--b)/9*.34);text-shadow:0 0 6px var(--c)}
@keyframes sp{to{transform:rotate(360deg)}}
#blk{position:absolute;pointer-events:none;z-index:1;border:2px solid rgba(230,200,130,.75);border-radius:6px;box-shadow:0 0 18px rgba(230,200,130,.5),inset 0 0 18px rgba(230,200,130,.25);animation:gl 2.6s ease-in-out infinite alternate}
#blk::before{content:"";position:absolute;inset:-9px;border:1px dashed rgba(230,200,130,.55);border-radius:50%;animation:sp 14s linear infinite;clip-path:none}
@keyframes gl{to{box-shadow:0 0 30px rgba(230,200,130,.8),inset 0 0 26px rgba(230,200,130,.4)}}
svg{position:absolute;inset:2%;width:96%;height:96%;pointer-events:none;z-index:2}
.fl{stroke-dasharray:6 26;animation:fw .9s linear infinite}
@keyframes fw{to{stroke-dashoffset:-32}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}
h1{margin:0;font-size:clamp(22px,6vw,38px);letter-spacing:.16em;font-weight:700;color:#d9b97a}
.sub{font-size:13px;letter-spacing:.14em;opacity:.8;margin-top:2px;padding:0 10px}
.bot{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.st{font-size:17px;letter-spacing:.18em;color:#d9b97a;text-shadow:0 2px 8px #000;min-height:22px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:700 14px 'Cormorant SC',Georgia,serif;letter-spacing:.14em;color:#e8d5b0;background:linear-gradient(#3a3026,#1a140e);border:1px solid #7a6642;padding:9px 14px;cursor:pointer;border-radius:3px;box-shadow:0 3px 10px #000}
button:hover{background:linear-gradient(#5a4a34,#2a2016);color:#fff3d0}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65))}
</style>
</head>
<body>
<div class="stage"><div class="board" id="board"><div class="grid" id="grid"></div><div id="blk"></div><svg id="svg" viewBox="0 0 900 900"></svg></div></div>
<canvas id="fx"></canvas><div class="vig"></div>
<div class="top"><h1>Печать древних рун</h1><div class="sub">Соедините руны · заполните камни · порталы телепортируют · алтарь вращается</div></div>
<div class="bot"><div class="st" id="st"></div><div class="btns"><button id="ro">⟳ Повернуть алтарь</button><button id="rs">Сбросить</button><button id="nw">Новая печать</button></div></div>
<script>
const N=9,B0=[3,3],RUNES="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ".split(""),
COLS=["#ff5a3c","#ffc247","#5fe08a","#4fc3ff","#b57bff","#ff6fb5","#3fe0d0","#d8e04f","#ff9a3c","#c98a5a"],
PC=[["#8f6bff","☾"],["#22e0c8","✧"]];
const $=id=>document.getElementById(id),eq=(p,q)=>p[0]==q[0]&&p[1]==q[1],sh=a=>a.sort(()=>Math.random()-.5),
K=(r,c)=>r*N+c,adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])==1;
let ends=[],portals=[],paths=[],blocked=new Set(),active=-1,won=false;

function gen(){
  for(;;){
    const free=new Set(),dead=new Set(),res=[],ptl=new Map(),P=[];
    for(let i=0;i<N*N;i++)free.add(i);
    const dist=(a,b)=>Math.abs((a/N|0)-(b/N|0))+Math.abs(a%N-b%N);
    for(let k=0;k<2;k++){let a,b;do{a=Math.random()*N*N|0;b=Math.random()*N*N|0}while(ptl.has(a)||ptl.has(b)||a==b||dist(a,b)<4);ptl.set(a,b);ptl.set(b,a);P.push([a,b]);}
    const nb=i=>{const r=i/N|0,c=i%N;return [[r+1,c],[r-1,c],[r,c+1],[r,c-1]].filter(([x,y])=>x>=0&&y>=0&&x<N&&y<N).map(([x,y])=>K(x,y))};
    const deg=i=>nb(i).filter(j=>free.has(j)).length,byDeg=(a,b)=>deg(a)-deg(b);
    let fail=false;
    while(free.size){
      const cand=[...free].filter(j=>!ptl.has(j));
      if(!cand.length){fail=true;break}
      const f=sh(cand).sort(byDeg)[0],p=[f],target=4+Math.floor(Math.random()*9);
      free.delete(f);
      while(p.length<target||ptl.has(p[p.length-1])){
        const o=nb(p[p.length-1]).filter(j=>free.has(j)&&(!ptl.has(j)||free.has(ptl.get(j))));
        if(!o.length)break;
        const po=o.filter(j=>ptl.has(j));
        const j=po.length&&Math.random()<.7?sh(po)[0]:(Math.random()<.25?sh(o)[0]:sh(o).sort(byDeg)[0]);
        free.delete(j);p.push(j);
        if(ptl.has(j)){const q=ptl.get(j);free.delete(q);p.push(q);}
      }
      if(ptl.has(p[p.length-1])){fail=true;break}
      if(p.length>=3)res.push(p);else p.forEach(j=>dead.add(j));
      if(dead.size>6){fail=true;break}
    }
    if(!fail&&res.length>=8&&res.length<=10)return{res,dead,P};
  }
}
const rc=i=>[i/N|0,i%N],inB=c=>c[0]>=B0[0]&&c[0]<B0[0]+3&&c[1]>=B0[1]&&c[1]<B0[1]+3,
rot=c=>inB(c)?[B0[0]+(c[1]-B0[1]),B0[1]+2-(c[0]-B0[0])]:c;

function build(){
  const{res,dead,P}=gen();won=false;active=-1;
  const cs=sh(COLS.slice()),rs=sh(RUNES.slice());
  ends=res.map((p,i)=>({a:rc(p[0]),b:rc(p[p.length-1]),col:cs[i],rune:rs[i]}));
  portals=P.map((q,i)=>({a:rc(q[0]),b:rc(q[1]),col:PC[i][0],sym:PC[i][1]}));
  blocked=new Set([...dead]);
  paths=ends.map(()=>[]);
  for(let k=1+Math.floor(Math.random()*3);k>0;k--)spin(false);
  render();draw();
}
function spin(anim=true){
  if(anim)paths=paths.map(p=>p.some(inB)?[]:p);
  ends.forEach(e=>{e.a=rot(e.a);e.b=rot(e.b)});
  portals.forEach(t=>{t.a=rot(t.a);t.b=rot(t.b)});
  blocked=new Set([...blocked].map(i=>K(...rot(rc(i)))));
  if(anim){render(true);draw();}
}
function render(an){
  const g=$("grid");g.style.gridTemplate=`repeat(${N},1fr)/repeat(${N},1fr)`;g.innerHTML="";
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement("div"),e=endIdx([r,c])>=0?ends[endIdx([r,c])]:null,t=pAt([r,c]);
    d.className="cell"+(blocked.has(K(r,c))?" x":"")+(an&&inB([r,c])?" spin":"");
    if(e)d.innerHTML=`<div class="rune" style="--c:${e.col}">${e.rune}</div>`;
    else if(t)d.innerHTML=`<div class="pt" style="--c:${t.t.col}"><i>${t.t.sym}</i></div>`;
    g.appendChild(d);
  }
  const k=96/N,s=$("blk").style;
  s.left=(2+k*B0[1])+"%";s.top=(2+k*B0[0])+"%";s.width=s.height=(k*3)+"%";
}
const endIdx=c=>ends.findIndex(e=>eq(e.a,c)||eq(e.b,c)),
occ=c=>paths.findIndex(p=>p.some(x=>eq(x,c))),
pAt=c=>{for(const t of portals){if(eq(t.a,c))return{o:t.b,t};if(eq(t.b,c))return{o:t.a,t}}return null},
done=i=>{const p=paths[i];return p.length>1&&((eq(p[0],ends[i].a)&&eq(p[p.length-1],ends[i].b))||(eq(p[0],ends[i].b)&&eq(p[p.length-1],ends[i].a)))},
ix=(p,c)=>p.findIndex(x=>eq(x,c));

function draw(){
  let s='<defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter></defs>';
  paths.forEach((p,i)=>{
    if(!p.length)return;
    const segs=[];let cur=[p[0]];
    for(let j=1;j<p.length;j++){if(adj(p[j-1],p[j]))cur.push(p[j]);else{segs.push(cur);cur=[p[j]]}}
    segs.push(cur);
    segs.forEach(sg=>{
      if(sg.length==1)sg=[sg[0],sg[0]];
      const pts=sg.map(([r,c])=>`${c*100+50},${r*100+50}`).join(" "),a=`fill="none" stroke-linecap="round" stroke-linejoin="round"`,col=ends[i].col;
      s+=`<polyline points="${pts}" ${a} stroke="${col}" stroke-width="58" opacity=".85" filter="url(#gl)"/><polyline points="${pts}" ${a} stroke="${col}" stroke-width="30" opacity=".92"/><polyline class="fl" points="${pts}" ${a} stroke="#fff" stroke-width="7" opacity=".75"/>`;
    });
  });
  $("svg").innerHTML=s;
  const k=ends.filter((_,i)=>done(i)).length,cov=paths.reduce((a,p)=>a+p.length,0),need=N*N-blocked.size;
  won=k==ends.length&&cov==need;
  $("board").classList.toggle("win",won);
  $("st").textContent=won?"✦ Печать снята ✦":`Руны: ${k}/${ends.length} · Камни: ${cov}/${need}`;
}
function cellAt(e){
  const r=$("grid").getBoundingClientRect(),x=(e.clientX-r.left)/r.width*N,y=(e.clientY-r.top)/r.height*N;
  return x<0||y<0||x>=N||y>=N?null:[Math.floor(y),Math.floor(x)];
}
function cut(c,except){
  const q=pAt(c);
  paths.forEach((p,i)=>{
    if(i==except)return;
    let a=ix(p,c);
    if(q){const b=ix(p,q.o);if(b>=0&&(a<0||b<a))a=b}
    if(a>=0)paths[i]=p.slice(0,a);
  });
}
function down(e){
  const c=cellAt(e);if(!c||blocked.has(K(...c)))return;
  const ei=endIdx(c);
  if(ei>=0){paths[ei]=[c];active=ei;}
  else{
    const o=occ(c);
    if(o>=0){
      const q=pAt(c),p=paths[o];let n=ix(p,c);
      if(q)n=Math.max(n,ix(p,q.o));
      paths[o]=p.slice(0,n+1);active=o;
    }
  }
  draw();
}
function move(e){
  if(active<0||won)return;
  const c=cellAt(e);if(!c||blocked.has(K(...c)))return;
  const p=paths[active],l=p[p.length-1];
  if(eq(c,l))return;
  const ql=pAt(l);
  if(ql&&p.length>=3&&eq(c,ql.o)&&eq(p[p.length-2],ql.o)){p.pop();p.pop();draw();return}
  if(!adj(c,l))return;
  if(p.length>1&&eq(c,p[p.length-2])){p.pop();draw();return}
  if(done(active))return;
  const ei=endIdx(c),q=pAt(c);
  if(ei>=0){if(ei==active&&!eq(c,p[0]))p.push(c);}
  else if(q){
    if(ix(p,c)>=0||ix(p,q.o)>=0)return;
    cut(c,active);p.push(c);p.push(q.o);
  }else{
    const o=occ(c);
    if(o==active)paths[o]=p.slice(0,ix(p,c)+1);
    else{if(o>=0)cut(c,active);p.push(c);}
  }
  draw();
}
const up=()=>{active=-1},b=$("board");
b.addEventListener("pointerdown",e=>{b.setPointerCapture(e.pointerId);down(e)});
b.addEventListener("pointermove",move);
b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
$("ro").onclick=()=>{spin(true)};
$("rs").onclick=()=>{paths=ends.map(()=>[]);draw()};
$("nw").onclick=build;
addEventListener("keydown",e=>{if(e.key=="r"||e.key=="к")spin(true)});

/* floating motes */
const cv=$("fx"),x=cv.getContext("2d");let W,H;
const rz=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rz();addEventListener("resize",rz);
const M=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),v:.00015+Math.random()*.0004,r:1+Math.random()*2.5,p:Math.random()*6,h:Math.random()<.7?40:200}));
(function f(t){
  x.clearRect(0,0,W,H);x.globalCompositeOperation="lighter";
  M.forEach(m=>{
    m.y-=m.v*16;if(m.y<-.02){m.y=1.02;m.x=Math.random()}
    const px=(m.x+Math.sin(t/2000+m.p)*.02)*W,py=m.y*H,a=.25+.25*Math.sin(t/600+m.p);
    const g=x.createRadialGradient(px,py,0,px,py,m.r*5);g.addColorStop(0,`hsla(${m.h},90%,70%,${a})`);g.addColorStop(1,"transparent");
    x.fillStyle=g;x.beginPath();x.arc(px,py,m.r*5,0,7);x.fill();
  });
  requestAnimationFrame(f);
})(0);
build();
</script>
</body>
</html>
